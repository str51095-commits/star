{% extends "base.html" %}
{% block body %}
<div class="card narrow">
  <h1>☀ 光伏方案设计</h1>
  <p class="muted">请使用公司分配的账号登录</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>用户名<input name="username" autocomplete="username" value="{{ request.form.get('username', '') }}" required autofocus></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary wide">登录</button>
  </form>
</div>
{% endblock %}
