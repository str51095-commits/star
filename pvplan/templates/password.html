{% extends "base.html" %}
{% block body %}
<div class="card narrow">
  <h1>修改密码</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>原密码<input name="old" type="password" required></label>
    <label>新密码（至少 6 位）<input name="new" type="password" minlength="6" required></label>
    <label>再输一次新密码<input name="new2" type="password" minlength="6" required></label>
    <button class="primary wide">保存</button>
  </form>
</div>
{% endblock %}
